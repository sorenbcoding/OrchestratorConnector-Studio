name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vsce package --no-dependencies --out orchestrator-connector-studio.vsix

      - uses: actions/upload-artifact@v5
        with:
          name: vsix
          path: orchestrator-connector-studio.vsix

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $name = "orchestrator-connector-studio-$($env:GITHUB_REF_NAME.TrimStart('v')).vsix"
          Rename-Item orchestrator-connector-studio.vsix $name
          gh release create $env:GITHUB_REF_NAME $name --title $env:GITHUB_REF_NAME --generate-notes
